server:
  port: 8080
  mode: debug
  shutdown_timeout: 10  # graceful shutdown timeout in seconds

database:
  type: sqlite
  host: localhost
  port: 3306
  user: root
  password: ""
  name: data/akari.db
  # dsn: ""  # override full DSN

cache:
  type: file
  redis_addr: localhost:6379
  redis_password: ""
  redis_db: 0
  file_dir: data/cache

jwt:
  secret: "change-me-in-production"   # HMAC secret key for signing tokens
  issuer: "akari"                      # token issuer claim
  expiration: 24h                      # token time-to-live (e.g. 1h, 24h, 7d)

logger:
  level: info
  format: console
  output_path: "data/logs/app.log"    # "" = stdout; path = file + rotation
  max_size: 100                        # MB before rotation
  max_age: 30                          # days to retain
  max_backups: 3                       # old files to keep
  compress: true                       # gzip rotated files
  local_time: true                     # use local time in filenames

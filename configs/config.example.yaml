server:
  port: 8080
  mode: debug
  read_header_timeout: 5
  read_timeout: 15
  write_timeout: 30
  idle_timeout: 60
  shutdown_timeout: 10

database:
  type: sqlite
  host: localhost
  port: 3306
  user: root
  password: ''
  name: data/akari.db
  # dsn: ""

cache:
  type: memory
  memory:
    default_ttl: 5m
    size: 1024
  redis:
    addr: localhost:6379
    password: ''
    db: 0
  file:
    dir: data/cache

jwt:
  secret: change-me-in-production
  issuer: akari
  expiration: 24h

captcha:
  enabled: true
  provider: gocaptcha # "gocaptcha" | "turnstile"
  type: click
  cache_prefix: 'captcha:'
  turnstile:
    site_key: ''
    secret_key: ''

auth:
  registration_enabled: true
  email_verification_enabled: true
  verify_email_token_ttl: 2h
  password_reset_enabled: true
  password_reset_token_ttl: 30m

smtp:
  host: smtp.example.com
  port: '465'
  username: your-email@example.com
  password: your-password
  from: your-email@example.com
  ssl: true
  timeout: 10
  queue_size: 100

logger:
  level: debug
  format: console
  output_path: data/logs/app.log
  max_size: 100
  max_age: 30
  max_backups: 3
  compress: true
  local_time: true

yggdrasil:
  server_name: Akari Yggdrasil
  implementation_name: akari-yggdrasil
  description: Minecraft 皮肤站 · 支持 Yggdrasil 与 authlib-injector

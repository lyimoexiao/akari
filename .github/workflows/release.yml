name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'lyimoexiao'
    outputs:
      version: ${{ steps.check-version.outputs.version }}
      created: ${{ steps.check-version.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: check-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Get previous version from the parent commit
          PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version}catch(e){'none'}" 2>/dev/null || echo "none")

          echo "Current version:  $VERSION"
          echo "Previous version: $PREV_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$PREV_VERSION" = "none" ] || [ "$VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed from '$PREV_VERSION' to '$VERSION'"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged"
          fi

  build-and-release:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build-only

      - name: Build backend binaries (cross-platform)
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-X github.com/lyimoexiao/akari/pkg/version.Version=$VERSION \
                   -X github.com/lyimoexiao/akari/pkg/version.Commit=$COMMIT \
                   -X github.com/lyimoexiao/akari/pkg/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p dist

          echo "Building for linux/amd64..."
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/akari-server-$VERSION-linux-amd64" ./cmd/server/

          echo "Building for darwin/amd64..."
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/akari-server-$VERSION-darwin-amd64" ./cmd/server/

          echo "Building for darwin/arm64..."
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o "dist/akari-server-$VERSION-darwin-arm64" ./cmd/server/

          echo "Building for windows/amd64..."
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/akari-server-$VERSION-windows-amd64.exe" ./cmd/server/

      - name: Archive frontend dist
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          tar -czf "dist/akari-web-$VERSION.tar.gz" -C web/dist .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: v${{ needs.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*
          fail_on_unmatched_files: true
